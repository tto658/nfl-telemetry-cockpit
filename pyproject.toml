[project]
name = "research-project"
version = "0.1.0"
description = "Reproducible NFL research & tracking analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "mcp-server-duckdb>=1.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "lifelines>=0.29.0",
    "linearmodels>=6.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.110.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "tracking_by_position", "combine_tracking_by_position", "data", "bdb2027", "artifacts", ".agents"]

